# LFS-Ayats Configuration
# Example default configuration

# InSim Connection
connection:
  host: 127.0.0.1          # LFS server IP
  port: 29999              # InSim port (default 29999)
  admin_password: ''       # Admin password (if needed)
  app_name: LFS-Ayats      # Application name (max 16 characters)
  udp: false               # Use UDP instead of TCP
  timeout: 5.0             # Connection timeout in seconds

# Telemetry
telemetry:
  interval: 100            # MCI/NLP interval in ms (100ms = 10Hz)
  max_history: 10000       # Maximum samples to keep in memory
  auto_export: false       # Export automatically
  export_interval: 60      # Automatic export interval (seconds)

# Export
export:
  format: csv              # Format: csv, json, database, or both
  output_dir: data         # Output directory
  filename_template: telemetry_{timestamp}  # File name template
  auto_compression: false  # Compress files automatically

# Database
database:
  type: sqlite             # sqlite, postgresql, mysql
  sqlite:
    path: ./data/telemetry.db  # SQLite file path
  postgresql:
    host: localhost
    port: 5432
    database: lfs_telemetry
    user: lfs_user
    password: ${DB_PASSWORD}  # From environment variable
  pool_size: 5             # Connection pool size (PostgreSQL/MySQL)
  max_overflow: 10         # Additional connections allowed
  echo: false              # SQL query logging (debug)

# Visualization
visualization:
  refresh_rate: 10         # Refresh rate in Hz
  show_realtime: true      # Show real-time data
  plot_history: 100        # Number of samples to show in charts

# Logging
logging:
  level: INFO              # Level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: null               # Log file (null to not use file)
  console: true            # Show logs in console

# External integrations
integrations:
  # Discord notifications
  discord:
    enabled: false         # Enable Discord integration
    webhook_url: null      # Discord webhook URL
    bot_token: null        # Bot token (optional, from environment variable)
    notifications:
      personal_best: true  # Notify personal best time
      session_summary: true  # Notify session summary
      anomalies: true      # Notify detected anomalies
  
  # Telegram bot
  telegram:
    enabled: false         # Enable Telegram integration
    bot_token: null        # Bot token (from environment variable)
    chat_id: null          # Default chat ID
  
  # Streaming overlay (OBS)
  streaming:
    enabled: false         # Enable streaming overlay
    overlay_port: 5000     # Overlay server port
    update_rate: 10        # Update frequency (Hz)
  
  # Cloud backup
  cloud_backup:
    enabled: false         # Enable automatic backup
    provider: google_drive # Provider: google_drive, dropbox
    auto_backup: true      # Automatic backup
    backup_interval: 3600  # Backup interval (seconds)
    credentials_path: ./credentials.json  # Credentials path
    folder_id: null        # Folder ID (Google Drive) or path (Dropbox)
