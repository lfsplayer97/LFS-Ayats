<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LFS Ayats Pro - Telemetria Avançada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #f0f6fc; font-family: 'SF Pro Display', system-ui, sans-serif; overflow-x: hidden; }
        .dashboard { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
        .sidebar { background: #161b22; padding: 20px; border-right: 1px solid #30363d; }
        .logo { font-size: 1.5em; font-weight: bold; color: #58a6ff; margin-bottom: 30px; }
        .nav-item { padding: 12px 16px; margin: 8px 0; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: #21262d; color: #58a6ff; }
        .main-content { padding: 20px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .connection-panel { background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; margin-bottom: 20px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .metric-card { background: linear-gradient(135deg, #1f2937 0%, #374151 100%); padding: 24px; border-radius: 12px; border: 1px solid #30363d; position: relative; overflow: hidden; }
        .metric-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #58a6ff, #79c0ff); }
        .metric-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .metric-icon { font-size: 24px; }
        .metric-value { font-size: 2.5em; font-weight: 700; color: #58a6ff; margin-bottom: 4px; }
        .metric-label { color: #8b949e; font-size: 14px; }
        .chart-container { background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; height: 300px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .btn-primary { background: #238636; color: white; }
        .btn-primary:hover { background: #2ea043; }
        .btn-danger { background: #da3633; color: white; }
        .btn-danger:hover { background: #f85149; }
        .btn:disabled { background: #30363d; color: #6e7681; cursor: not-allowed; }
        .status-indicator { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; }
        .status-ready { background: #1a2332; color: #79c0ff; border: 1px solid #1f6feb; }
        .status-connected { background: #0d2818; color: #56d364; border: 1px solid #238636; }
        .status-error { background: #2d1617; color: #f85149; border: 1px solid #da3633; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="sidebar">
            <div class="logo">🏎️ LFS AYATS PRO</div>
            <div class="nav-item active" onclick="showPanel('telemetry')">📊 Telemetria</div>
            <div class="nav-item" onclick="showPanel('setup')">⚙️ Setup</div>
            <div class="nav-item" onclick="showPanel('analysis')">📈 Anàlisi</div>
            <div class="nav-item" onclick="showPanel('records')">🏆 Rècords</div>
            <div class="nav-item" onclick="showPanel('settings')">⚙️ Configuració</div>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>Telemetria en Temps Real</h1>
                <div class="status-indicator status-ready" id="connectionStatus">
                    🔴 Desconnectat
                </div>
            </div>

            <div class="connection-panel">
                <h3 style="margin-bottom: 16px;">Connexió InSim</h3>
                <div style="display: flex; gap: 16px; align-items: center;">
                    <input type="text" id="host" value="localhost" placeholder="Host" style="padding: 8px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #f0f6fc;">
                    <input type="number" id="port" value="29999" placeholder="Port" style="padding: 8px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #f0f6fc;">
                    <button class="btn btn-primary" id="connectBtn" onclick="connect()">🚀 Connectar</button>
                    <button class="btn btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>🔌 Desconnectar</button>
                </div>
            </div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-icon">🏎️</span>
                        <span style="color: #56d364;">●</span>
                    </div>
                    <div class="metric-value" id="speedValue">0</div>
                    <div class="metric-label">Velocitat (km/h)</div>
                </div>

                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-icon">⚡</span>
                        <span style="color: #f79000;">●</span>
                    </div>
                    <div class="metric-value" id="rpmValue">0</div>
                    <div class="metric-label">RPM</div>
                </div>

                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-icon">⚙️</span>
                        <span style="color: #58a6ff;">●</span>
                    </div>
                    <div class="metric-value" id="gearValue">N</div>
                    <div class="metric-label">Marxa Actual</div>
                </div>

                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-icon">🏁</span>
                        <span style="color: #db61a2;">●</span>
                    </div>
                    <div class="metric-value" id="lapTime">0:00.000</div>
                    <div class="metric-label">Temps de Volta</div>
                </div>
            </div>

            <div class="chart-container">
                <h3 style="margin-bottom: 16px;">Gràfic de Velocitat</h3>
                <div style="height: 240px; display: flex; align-items: center; justify-content: center; color: #6e7681;">
                    📈 Gràfic de telemetria (simulació)
                </div>
            </div>
        </div>
    </div>

    <script>
        var isConnected = false;
        var telemetryTimer;
        var lapTimer = 0;

        function connect() {
            var status = document.getElementById('connectionStatus');
            var connectBtn = document.getElementById('connectBtn');
            var disconnectBtn = document.getElementById('disconnectBtn');

            status.textContent = '🟡 Connectant...';
            status.className = 'status-indicator status-ready';
            connectBtn.disabled = true;

            setTimeout(function() {
                isConnected = true;
                status.textContent = '🟢 Connectat';
                status.className = 'status-indicator status-connected';
                disconnectBtn.disabled = false;
                startTelemetry();
            }, 2000);
        }

        function disconnect() {
            isConnected = false;
            stopTelemetry();

            document.getElementById('connectionStatus').textContent = '🔴 Desconnectat';
            document.getElementById('connectionStatus').className = 'status-indicator status-ready';
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
        }

        function startTelemetry() {
            telemetryTimer = setInterval(function() {
                if (isConnected) {
                    document.getElementById('speedValue').textContent = Math.floor(Math.random() * 320);
                    document.getElementById('rpmValue').textContent = Math.floor(Math.random() * 9000);
                    document.getElementById('gearValue').textContent = Math.floor(Math.random() * 6) + 1;
                    
                    lapTimer += 0.1;
                    var minutes = Math.floor(lapTimer / 60);
                    var seconds = Math.floor(lapTimer % 60);
                    var milliseconds = Math.floor((lapTimer % 1) * 1000);
                    document.getElementById('lapTime').textContent = 
                        minutes + ':' + seconds.toString().padStart(2, '0') + '.' + milliseconds.toString().padStart(3, '0');
                }
            }, 100);
        }

        function stopTelemetry() {
            if (telemetryTimer) {
                clearInterval(telemetryTimer);
                document.getElementById('speedValue').textContent = '0';
                document.getElementById('rpmValue').textContent = '0';
                document.getElementById('gearValue').textContent = 'N';
                document.getElementById('lapTime').textContent = '0:00.000';
                lapTimer = 0;
            }
        }

        function showPanel(panel) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
            console.log('Mostrant panel:', panel);
        }
    </script>
</body>
</html>
