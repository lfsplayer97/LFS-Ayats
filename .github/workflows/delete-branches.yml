---
name: Delete All Branches

'on':
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DELETE ALL BRANCHES" to confirm'
        required: true
        type: string

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DELETE ALL BRANCHES'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete all branches except main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching all remote branches..."
          git fetch --all

          echo "Getting list of branches to delete..."
          branches=$(git branch -r | grep -v '\->' | \
            grep -v 'origin/main' | sed 's/origin\///')

          if [ -z "$branches" ]; then
            echo "No branches to delete."
            exit 0
          fi

          echo "Branches to be deleted:"
          echo "$branches"

          echo "Deleting branches..."
          for branch in $branches; do
            echo "Deleting branch: $branch"
            git push origin --delete "$branch" || \
              echo "Failed to delete $branch"
          done

          echo "Branch deletion complete!"
