<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LFS Ayats - Simple</title>
    <style>
        body { background: #1a1a2e; color: #00ff88; font-family: Arial; padding: 20px; text-align: center; }
        h1 { font-size: 3em; margin-bottom: 30px; }
        .container { max-width: 700px; margin: 0 auto; }
        button { padding: 15px 30px; background: #00ff88; color: #1a1a2e; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px; font-weight: bold; transition: all 0.3s; }
        button:hover { background: #00cc6a; transform: scale(1.05); }
        button:disabled { background: #666; color: #999; transform: none; cursor: not-allowed; }
        .status { padding: 20px; margin: 20px 0; border-radius: 10px; font-size: 20px; font-weight: bold; }
        .ready { background: #003d1a; border: 2px solid #00ff88; }
        .connecting { background: #4d3300; color: #ffaa00; border: 2px solid #ffaa00; }
        .connected { background: #001a0d; border: 2px solid #00ff88; }
        .error { background: #4d0000; color: #ff4444; border: 2px solid #ff4444; }
        .data-grid { display: flex; gap: 20px; justify-content: center; margin: 30px 0; flex-wrap: wrap; }
        .data-card { background: #00ff88; color: #1a1a2e; padding: 20px; border-radius: 10px; min-width: 120px; }
        .data-value { font-size: 2em; font-weight: bold; }
        .data-label { font-size: 0.9em; }
        .connection-input { margin: 10px 0; }
        .connection-input input { padding: 10px; border: 2px solid #00ff88; border-radius: 8px; background: #1a1a2e; color: #00ff88; font-size: 14px; width: 200px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏎️ LFS AYATS</h1>
        
        <div class="connection-input">
            <input type="text" id="wsUrl" value="ws://127.0.0.1:30333" placeholder="WebSocket URL">
        </div>
        
        <button onclick="connect()">🚀 CONNECTAR</button>
        <button onclick="disconnect()" id="disconnectBtn" disabled>🔌 DESCONNECTAR</button>
        
        <div id="status" class="status ready">✅ PREPARAT PER CONNECTAR</div>
        
        <div class="data-grid">
            <div class="data-card">
                <div class="data-value" id="speed">0</div>
                <div class="data-label">🏎️ KM/H</div>
            </div>
            <div class="data-card">
                <div class="data-value" id="gear">N</div>
                <div class="data-label">⚙️ MARXA</div>
            </div>
            <div class="data-card">
                <div class="data-value" id="lap">-</div>
                <div class="data-label">🏁 VOLTA</div>
            </div>
            <div class="data-card">
                <div class="data-value" id="delta">+0.00</div>
                <div class="data-label">⏱️ DELTA</div>
            </div>
        </div>
    </div>

    <script>
        // Constants
        var MS_TO_KMH = 3.6;  // Conversion factor from m/s to km/h
        
        var ws = null;
        var isConnected = false;

        function connect() {
            var wsUrl = document.getElementById('wsUrl').value;
            
            document.getElementById('status').innerHTML = '🔄 CONNECTANT...';
            document.getElementById('status').className = 'status connecting';
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = function() {
                    isConnected = true;
                    document.getElementById('status').innerHTML = '✅ CONNECTAT!';
                    document.getElementById('status').className = 'status connected';
                    document.getElementById('disconnectBtn').disabled = false;
                    console.log('WebSocket connected to', wsUrl);
                };
                
                ws.onmessage = function(event) {
                    try {
                        var data = JSON.parse(event.data);
                        updateTelemetry(data);
                    } catch (e) {
                        console.error('Failed to parse telemetry data:', e);
                    }
                };
                
                ws.onerror = function(error) {
                    console.error('WebSocket error:', error);
                    document.getElementById('status').innerHTML = '❌ ERROR DE CONNEXIÓ';
                    document.getElementById('status').className = 'status error';
                };
                
                ws.onclose = function() {
                    isConnected = false;
                    document.getElementById('status').innerHTML = '✅ PREPARAT PER CONNECTAR';
                    document.getElementById('status').className = 'status ready';
                    document.getElementById('disconnectBtn').disabled = true;
                    resetDisplay();
                    console.log('WebSocket disconnected');
                };
            } catch (error) {
                console.error('Failed to connect:', error);
                document.getElementById('status').innerHTML = '❌ ERROR DE CONNEXIÓ';
                document.getElementById('status').className = 'status error';
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function updateTelemetry(data) {
            if (data.player) {
                var player = data.player;
                
                // Speed
                if (player.speed !== undefined) {
                    var speedKmh = Math.round(player.speed * MS_TO_KMH);
                    document.getElementById('speed').textContent = speedKmh;
                }
                
                // Lap info
                if (player.lap && player.lap.number !== undefined) {
                    document.getElementById('lap').textContent = player.lap.number;
                }
                
                // Delta
                if (player.delta_ms !== undefined) {
                    var delta = player.delta_ms / 1000;
                    var deltaEl = document.getElementById('delta');
                    deltaEl.textContent = (delta >= 0 ? '+' : '') + delta.toFixed(2);
                    deltaEl.style.color = delta >= 0 ? '#ff4444' : '#00ff88';
                }
            }
        }

        function resetDisplay() {
            document.getElementById('speed').textContent = '0';
            document.getElementById('gear').textContent = 'N';
            document.getElementById('lap').textContent = '-';
            document.getElementById('delta').textContent = '+0.00';
        }
    </script>
</body>
</html>
