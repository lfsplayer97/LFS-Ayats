<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LFS Ayats - Aplicació Principal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #007cba;
        }
        .logo { color: #007cba; font-size: 2.5em; font-weight: bold; }
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        .panel {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            border-left: 5px solid #007cba;
        }
        .panel h3 { color: #007cba; margin-bottom: 20px; font-size: 1.3em; }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: all 0.3s;
            font-weight: 600;
        }
        .btn-primary { background: #007cba; color: white; }
        .btn-primary:hover { background: #005a87; transform: translateY(-2px); }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #1e7e34; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }
        .btn:disabled { background: #6c757d; cursor: not-allowed; transform: none; }
        .status-bar {
            background: #e9ecef;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        .status-ready { background: #d4edda; color: #155724; }
        .status-connecting { background: #fff3cd; color: #856404; }
        .status-connected { background: #cce5ff; color: #004085; }
        .status-error { background: #f8d7da; color: #721c24; }
        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .metric-card {
            background: #007cba;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,124,186,0.3);
        }
        .metric-value { font-size: 2em; font-weight: bold; }
        .metric-label { font-size: 0.9em; opacity: 0.9; }
        input { 
            padding: 10px; 
            border: 2px solid #dee2e6; 
            border-radius: 6px; 
            font-size: 16px; 
            margin: 5px; 
        }
        input:focus { border-color: #007cba; outline: none; }
        .lang-selector select {
            padding: 8px 15px;
            border: 2px solid #007cba;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="logo">🏎️ LFS AYATS</div>
            <div class="lang-selector">
                <select id="languageSelect">
                    <option value="ca">🏴󠁥󠁳󠁣󠁴󠁿 Català</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="es">🇪🇸 Español</option>
                </select>
            </div>
        </div>

        <div class="controls-grid">
            <div class="panel">
                <h3>🔌 Connexió InSim</h3>
                <input type="text" id="host" value="localhost" placeholder="Host del servidor">
                <input type="number" id="port" value="29999" placeholder="Port">
                <br>
                <button class="btn btn-primary" id="connectBtn">🚀 Connectar</button>
                <button class="btn btn-danger" id="disconnectBtn" disabled>🔌 Desconnectar</button>
            </div>

            <div class="panel">
                <h3>⚙️ Controls</h3>
                <button class="btn btn-success" id="recordBtn" disabled>📊 Iniciar Gravació</button>
                <button class="btn btn-primary" id="exportBtn" disabled>💾 Exportar Dades</button>
                <br>
                <button class="btn btn-primary" id="settingsBtn">⚙️ Configuració</button>
                <button class="btn btn-primary" id="aboutBtn">ℹ️ Sobre</button>
            </div>
        </div>

        <div id="statusBar" class="status-bar status-ready">
            ✅ Sistema preparat - Connecta't a Live for Speed
        </div>

        <div class="telemetry-grid">
            <div class="metric-card">
                <div class="metric-value" id="speedValue">0</div>
                <div class="metric-label">🏎️ Velocitat (km/h)</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="rpmValue">0</div>
                <div class="metric-label">⚡ RPM</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="gearValue">N</div>
                <div class="metric-label">⚙️ Marxa</div>
            </div>
            <div class="metric-card">
                <div class="metric-value" id="lapValue">0</div>
                <div class="metric-label">🏁 Volta</div>
            </div>
        </div>
    </div>

    <script>
        var isConnected = false;
        var isRecording = false;
        var telemetryTimer;
        var currentLang = 'ca';
        
        var texts = {
            ca: { ready: '✅ Sistema preparat - Connectat a Live for Speed', connecting: '🔄 Connectant al servidor...', connected: '✅ Connectat correctament!', failed: '❌ Error de connexió' },
            en: { ready: '✅ System ready - Connect to Live for Speed', connecting: '🔄 Connecting to server...', connected: '✅ Connected successfully!', failed: '❌ Connection failed' },
            es: { ready: '✅ Sistema listo - Conéctate a Live for Speed', connecting: '🔄 Conectando al servidor...', connected: '✅ Conectado correctamente!', failed: '❌ Error de conexión' }
        };

        function connect() {
            var statusBar = document.getElementById('statusBar');
            var connectBtn = document.getElementById('connectBtn');
            var disconnectBtn = document.getElementById('disconnectBtn');
            var recordBtn = document.getElementById('recordBtn');

            statusBar.textContent = texts[currentLang].connecting;
            statusBar.className = 'status-bar status-connecting';
            connectBtn.disabled = true;

            setTimeout(function() {
                isConnected = true;
                statusBar.textContent = texts[currentLang].connected;
                statusBar.className = 'status-bar status-connected';
                disconnectBtn.disabled = false;
                recordBtn.disabled = false;
                startTelemetry();
            }, 2000);
        }

        function disconnect() {
            isConnected = false;
            stopTelemetry();
            stopRecording();
            
            document.getElementById('statusBar').textContent = texts[currentLang].ready;
            document.getElementById('statusBar').className = 'status-bar status-ready';
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            document.getElementById('recordBtn').disabled = true;
        }

        function startTelemetry() {
            telemetryTimer = setInterval(function() {
                if (isConnected) {
                    document.getElementById('speedValue').textContent = Math.floor(Math.random() * 320);
                    document.getElementById('rpmValue').textContent = Math.floor(Math.random() * 9000);
                    document.getElementById('gearValue').textContent = Math.floor(Math.random() * 6) + 1;
                    document.getElementById('lapValue').textContent = Math.floor(Math.random() * 50) + 1;
                }
            }, 500);
        }

        function stopTelemetry() {
            if (telemetryTimer) {
                clearInterval(telemetryTimer);
                document.getElementById('speedValue').textContent = '0';
                document.getElementById('rpmValue').textContent = '0';
                document.getElementById('gearValue').textContent = 'N';
                document.getElementById('lapValue').textContent = '0';
            }
        }

        function toggleRecording() {
            var recordBtn = document.getElementById('recordBtn');
            var exportBtn = document.getElementById('exportBtn');
            
            if (!isRecording) {
                isRecording = true;
                recordBtn.textContent = '⏹️ Aturar Gravació';
                recordBtn.className = 'btn btn-danger';
                exportBtn.disabled = true;
            } else {
                isRecording = false;
                recordBtn.textContent = '📊 Iniciar Gravació';
                recordBtn.className = 'btn btn-success';
                exportBtn.disabled = false;
            }
        }

        // Event listeners
        document.getElementById('connectBtn').onclick = connect;
        document.getElementById('disconnectBtn').onclick = disconnect;
        document.getElementById('recordBtn').onclick = toggleRecording;
        document.getElementById('exportBtn').onclick = function() { alert('Dades exportades a CSV!'); };
        document.getElementById('settingsBtn').onclick = function() { alert('Configuració (en desenvolupament)'); };
        document.getElementById('aboutBtn').onclick = function() { alert('LFS Ayats v1.0 - Sistema de telemetria professional'); };
        
        document.getElementById('languageSelect').onchange = function(e) {
            currentLang = e.target.value;
            if (!isConnected) {
                document.getElementById('statusBar').textContent = texts[currentLang].ready;
            }
        };
    </script>
</body>
</html>
